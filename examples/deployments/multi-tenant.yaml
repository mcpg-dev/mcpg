# yaml-language-server: $schema=./config.schema.json
#
# Deployment: multi-tenant
# ------------------------
# A single gateway serving multiple tenants identified by their OIDC
# subject claim. Per-tenant rate limiting via the rate-limit plugin
# (CEL-keyed by tenant id), and a binding `governance.allow_if` rule
# that gates a sensitive binding to only members of `tenant_admins`.
#
# This is *application-layer* multi-tenancy: every tenant lands at the
# same `bind_address` and is resolved by their token. Subdomain-based
# routing (different host -> different gateway) is handled by your
# reverse proxy / ingress, not in this YAML.
#
# Required env vars:
#   MCPG_REDIS_URL          — rediss:// preferred
#   MCPG_REDIS_PASSWORD     — Redis password, kept out of the URL
#   MCPG_CLUSTER_STATE_KEY  — URL-safe-base64 32-byte state key, same on
#                             every replica
#   MCPG_LICENSE_PUBKEY     — public key (SPKI PEM) that verifies the license

gateway:
  server:
    bind_address: "0.0.0.0:8787"
    mcp_path: "/mcp"
    health_path: "/health"
    allowed_origins:
      - "https://gateway.example.com"
    request_timeout_ms: 30000
    session_idle_timeout_ms: 900000
    # Per-tenant concurrent-session cap (keyed by resolved tenant id).
    # 0 = unlimited; 100 is a starting point — raise per SLA tier.
    max_sessions_per_tenant: 100

cluster:
  # Use a TLS scheme — set MCPG_REDIS_URL to a `rediss://…` URL. The boot
  # guard refuses a plaintext `redis://` coordinator (it carries all tenant
  # state) unless `allow_insecure_transport: true`. Supply the password
  # out-of-URL via the `password` field, not embedded in the URL.
  kind: redis
  url: "${env.MCPG_REDIS_URL}"
  password: "${env.MCPG_REDIS_PASSWORD}"
  key_prefix: "mcpg:multi-tenant"
  # Required for any non-single_node cluster: seals all Redis-held tenant
  # state (sessions incl. SSE replay, pipelines, tasks, delivery, …) with
  # XChaCha20-Poly1305 and derives the cross-replica modern-session resume
  # key. Names the env var (no `${env.…}`); the var must hold a
  # URL-safe-base64 32-byte key, IDENTICAL on every replica:
  #   openssl rand -base64 32 | tr '+/' '-_'
  state_encryption_key_env: "MCPG_CLUSTER_STATE_KEY"

# The Redis coordinator is a licensed plugin: the gateway refuses to load
# it without a license that entitles `cluster.*` plugins (Team,
# Enterprise). Outside production, `non_production_use: true` in place of
# the token loads it under the non-production grant.
license:
  token_file: "/etc/mcpg/license/license.jwt"
  pubkey_pem: "${env.MCPG_LICENSE_PUBKEY}"

governance:
  access:
    oidc_oauth:
      providers:
        - issuer: "https://example.okta.com"
          audiences: ["mcpg-gateway"]
          verification:
            kind: oidc_jwks
            allowed_algs: ["RS256"]
  audit:
    enabled: true
    required: true
    on_failure: fail_closed
    sinks:
      - kind: dev.mcpg.builtin.audit.local-file
        config: { path: "/var/log/mcpg/audit.log" }

# The gateway image carries no plugins: each entry below is a signed
# artifact the gateway pulls and verifies at boot. Without the Redis or
# the OIDC entry the gateway refuses to boot; without the Prometheus entry
# it boots but exports no metrics. Pin the releases that match the
# gateway you run, or point `oci:` at your mirror of them.
plugins:
  # The coordinator `cluster.kind: redis` selects. It takes its settings
  # from the `cluster:` block, so the entry carries no `config:`.
  - id: dev.mcpg.cluster.redis
    class: cluster
    source:
      oci: "ghcr.io/mcpg-dev/plugins/cluster-redis:0.1.0-alpha.41"
    granted_capabilities: [network_outbound]
  # Its `providers` must match `governance.access.oidc_oauth.providers`.
  - id: dev.mcpg.identity.oidc
    class: identity_provider
    source:
      oci: "ghcr.io/mcpg-dev/plugins/identity-oidc:0.1.0-alpha.41"
    # OIDC discovery and JWKS fetches from the IdP.
    granted_capabilities: [network_outbound]
    config:
      providers:
        - issuer: "https://example.okta.com"
          audiences: ["mcpg-gateway"]
          verification:
            kind: oidc_jwks
            allowed_algs: ["RS256"]
  # Tool gate enforced before every dispatch. Its default `per_principal`
  # scope keys the bucket on the principal id, so each tenant gets its own
  # budget; adjust `default_limit` per SLA tier. Per-tenant limits need
  # this plugin: `server.anonymous_rate_limit_*` and
  # `server.completion_rate_limit_per_sec` are server-wide ceilings on
  # anonymous traffic and completions, not per-invocation gating.
  - id: dev.mcpg.rate-limit
    class: tool_gate
    source:
      oci: "ghcr.io/mcpg-dev/plugins/rate-limit:0.1.0-alpha.42"
    config:
      # per_principal scope (the default) keys the bucket on the
      # authenticated principal; unauthenticated requests fall back
      # to the session id.
      default_limit: 600
      default_window_ms: 60000
      default_burst: 50
  - id: dev.mcpg.observability.prometheus
    class: metrics_sink
    source:
      oci: "ghcr.io/mcpg-dev/plugins/observability-prometheus:0.1.0-alpha.41"

mcp:
  capabilities:
    tools:
      - name: api.tenant.lookup
        description: Per-tenant lookup. Available to every authenticated
          caller — rate-limited per tenant by the tool-gate above.
        backend:
          kind: http
          url: "https://internal/api/tenants/${identity.subject_id}"
          method: get
          timeout_ms: 5000
          expected_status_codes: [200]
      - name: api.admin.tenant.delete
        description: Tenant deletion — restricted to tenant_admins group
          via the binding's allow_if. Posts to the upstream's
          delete-by-id endpoint.
        governance:
          allow_if: '"tenant_admins" in identity.groups'
        backend:
          kind: http
          url: "https://internal/api/tenants/${arguments.tenant_id}/delete"
          method: post
          timeout_ms: 10000
          expected_status_codes: [200, 204]

observability:
  logs:
    level: info
    sinks:
      - kind: stderr
        config: { format: json }
  # Served on the gateway listener (`bind_address`), not a port of its own.
  metrics:
    sinks:
      - kind: dev.mcpg.observability.prometheus
        config: { path: "/metrics" }
