# yaml-language-server: $schema=./config.schema.json
#
# Deployment: production-redis-cluster
# ------------------------------------
# Multi-replica gateway running behind a load balancer, every replica
# coordinating via Redis (cluster KV + pub/sub for delivery and
# cancellation fan-out). Designed for kubernetes Deployment with N
# replicas where any replica can answer any session.
#
# What's different from production-single-redis:
#   - delivery + cancellation buses are pinned to the cluster's pub/sub
#     primitive so server-initiated messages reach the right replica.
#   - each replica writes its audit trail to a host-mounted path; ship
#     that path to a central SIEM with a filebeat/vector/fluentbit
#     sidecar so the trail is greppable across all N pods.
#
# Required env vars:
#   MCPG_REDIS_URL          — rediss:// preferred
#   MCPG_REDIS_PASSWORD     — Redis password, kept out of the URL
#   MCPG_CLUSTER_STATE_KEY  — URL-safe-base64 32-byte state key, same on
#                             every replica
#   MCPG_LICENSE_PUBKEY     — public key (SPKI PEM) that verifies the license
#   ACCOUNTS_API_TOKEN      — upstream token of the example binding

gateway:
  server:
    bind_address: "0.0.0.0:8787"
    mcp_path: "/mcp"
    health_path: "/health"
    allowed_origins:
      - "https://gateway.example.com"
    request_timeout_ms: 30000
    session_idle_timeout_ms: 900000
    shutdown_timeout_ms: 60000  # extra room for in-flight SSE drain

cluster:
  # Use a TLS scheme: set MCPG_REDIS_URL to a `rediss://…` URL. The boot
  # guard refuses a plaintext `redis://` coordinator unless
  # `allow_insecure_transport: true`. Pass the password out-of-URL.
  kind: redis
  url: "${env.MCPG_REDIS_URL}"
  password: "${env.MCPG_REDIS_PASSWORD}"
  key_prefix: "mcpg:prod"
  # Required for any non-single_node cluster: seals all coordinator-backed
  # capability state (sessions incl. SSE replay, pipelines, tasks, delivery,
  # cancellation, …) with XChaCha20-Poly1305 and derives the key that makes
  # modern-session resume work across replicas. Names the env var (no
  # `${env.…}` — the key itself never sits in the config); the var must hold
  # a URL-safe-base64 32-byte key, IDENTICAL on every replica:
  #   openssl rand -base64 32 | tr '+/' '-_'
  state_encryption_key_env: "MCPG_CLUSTER_STATE_KEY"

# The Redis coordinator is a licensed plugin: the gateway refuses to load
# it without a license that entitles `cluster.*` plugins (Team,
# Enterprise). Outside production, `non_production_use: true` in place of
# the token loads it under the non-production grant.
license:
  token_file: "/etc/mcpg/license/license.jwt"
  pubkey_pem: "${env.MCPG_LICENSE_PUBKEY}"

# `delivery` and `cancellation` are intentionally omitted — when their
# `bus` is unset they inherit the cluster's pub/sub primitive (Redis
# pub-sub here), which is what we want so a `notifications/cancelled`
# published on replica-A reaches the active SSE stream on replica-B.
# Set `mcp.configurations.delivery.bus.kind: memory` (or similar
# in-process variant) only when you explicitly want single-replica
# behaviour despite a cluster.

governance:
  access:
    oidc_oauth:
      providers:
        - issuer: "https://example.okta.com"
          audiences: ["mcpg-gateway"]
          verification:
            kind: oidc_jwks
            allowed_algs: ["RS256"]
  # Audit is required (the gateway refuses to start if no sink serves
  # traffic). The built-in local-file sink writes JSON Lines, hash-chained
  # per spec §9.12, to `path`. Each replica writes its own file — mount
  # `path` on a host volume and forward it to a central SIEM (filebeat /
  # vector / fluentbit) so the trail is greppable across all pods.
  audit:
    enabled: true
    required: true
    on_failure: fail_closed
    sinks:
      - kind: dev.mcpg.builtin.audit.local-file
        config:
          path: "/var/log/mcpg/audit.log"

# The gateway image carries no plugins: each entry below is a signed
# artifact the gateway pulls and verifies at boot. Without the Redis or
# the OIDC entry the gateway refuses to boot; without a sink's entry it
# boots but does not export that signal. Pin the releases that match the
# gateway you run, or point `oci:` at your mirror of them.
plugins:
  # The coordinator `cluster.kind: redis` selects. It takes its settings
  # from the `cluster:` block, so the entry carries no `config:`.
  - id: dev.mcpg.cluster.redis
    class: cluster
    source:
      oci: "ghcr.io/mcpg-dev/plugins/cluster-redis:0.1.0-alpha.41"
    granted_capabilities: [network_outbound]
  # Its `providers` must match `governance.access.oidc_oauth.providers`.
  - id: dev.mcpg.identity.oidc
    class: identity_provider
    source:
      oci: "ghcr.io/mcpg-dev/plugins/identity-oidc:0.1.0-alpha.41"
    # OIDC discovery and JWKS fetches from the IdP.
    granted_capabilities: [network_outbound]
    config:
      providers:
        - issuer: "https://example.okta.com"
          audiences: ["mcpg-gateway"]
          verification:
            kind: oidc_jwks
            allowed_algs: ["RS256"]
  - id: dev.mcpg.observability.prometheus
    class: metrics_sink
    source:
      oci: "ghcr.io/mcpg-dev/plugins/observability-prometheus:0.1.0-alpha.41"
  # Exports spans over OTLP/gRPC, so `url` names the collector's gRPC
  # port (4317), not its OTLP/HTTP one (4318).
  - id: dev.mcpg.observability.otlp
    class: telemetry_sink
    source:
      oci: "ghcr.io/mcpg-dev/plugins/observability-otlp:0.1.0-alpha.41"
    granted_capabilities: [network_outbound]
    config:
      url: "http://otel-collector.observability.svc.cluster.local:4317"
      service_name: "mcpg-gateway"

mcp:
  capabilities:
    tools:
      - name: api.account.lookup
        description: Look up an account by id via the corporate accounts API.
        governance:
          minimum_trust: verified
        retry:
          max_attempts: 3
          initial_backoff_ms: 200
        backend:
          kind: http
          url: "https://accounts.internal.example.com/v1/accounts/${arguments.account_id}"
          method: get
          timeout_ms: 5000
          headers:
            Authorization: "Bearer ${env.ACCOUNTS_API_TOKEN}"
          expected_status_codes: [200]

observability:
  logs:
    level: info
    sinks:
      - kind: stderr
        config: { format: json }
  # Served on the gateway listener (`bind_address`), not a port of its own.
  metrics:
    sinks:
      - kind: dev.mcpg.observability.prometheus
        config: { path: "/metrics" }
  # The collector endpoint is the `config.url` of the plugin entry above.
  traces:
    enabled: true
    service_name: "mcpg-gateway"
    sinks:
      - kind: dev.mcpg.observability.otlp
