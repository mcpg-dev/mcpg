[package]
name = "mcpg-example-host-handle-demo"
version = "0.1.0-dev.0"
license.workspace = true
edition = "2024"
description = "Canonical reference plugin — a Backend that stores HostHandle on Self and demonstrates every documented HostHandle surface (resolve_secret, config_snapshot, audit_event, span, counter/histogram)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Default to both paths so workspace `cargo build` produces a
# working OCI-distributable cdylib AND keeps `register_static()`
# compilable for embedded use. Real plugin crates typically pick
# ONE default (cdylib for distribution; static-firstparty for
# in-house gateway builds); this reference enables both so new
# authors see how the feature interplay works. The unit test
# below relies on `static-firstparty` because the Recorder host
# is a direct `HostServices` impl, not an FFI vtable.
default = ["cdylib-export", "static-firstparty"]
cdylib-export = ["mcpg-plugin-sdk/cdylib-export"]
static-firstparty = ["mcpg-plugin-sdk/static-firstparty"]

[dependencies]
mcpg-plugin-protocol = { path = "../../../libs/plugin-protocol" }
mcpg-plugin-sdk = { path = "../../../libs/plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The Recorder unit test runs inside a multi-threaded tokio
# runtime so HostHandle's `block_on_or_err` has a runtime handle
# to drive the async HostServices methods through.
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
