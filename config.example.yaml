#       dev.mcpg.catalog.builtin | tools{<id>:{metadata, hide}}, defaults{hide_unknown}, global_defaults{}
#
# Validation (config load): id non-empty + unique; kind ∈ {native, wasm};
# class ∈ the 21 PluginClass values; source declares exactly one of path|oci.
# The artifact at `source.path` is loaded + hash/signature-verified at BOOT
# (not at config-validate), so this file validates even before the .so exists.
#
# Plugin chain evaluation:
#   tool-gate:  pre_dispatch runs before tool execution; first deny/challenge wins
#               post_dispatch runs after; first deny wins
#               Allow decisions accumulate metadata (merged across plugins)
#   transform:  pre runs on arguments before dispatch; post runs on result after
#               No short-circuit; errors logged and skipped
#   identity:   First Resolved() wins; None falls through; Invalid logged + skipped
#
# Metrics: every tool-gate evaluation emits mcpg_plugin_evaluations_total
# with labels: plugin_id, phase (pre/post), decision (allow/deny/challenge/error)
# Slow evaluations (>50ms) trigger a warning log.
#
# Plugin CLI extension:
#   mcpg plugin <command> [options]
#   Delegates to `mcpg-plugin` binary on PATH.
#   Install with: cargo install mcpg-plugin-sdk
#   Available commands: new, build, test, sign, hash, verify, list, publish