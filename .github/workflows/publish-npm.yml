# Managed by the release pipeline — changes made here are overwritten.
#
# Publishes the @mcpg-dev/cli npm suite from published release artifacts:
# every binary is downloaded from a GitHub Release of its own repository,
# so npm serves exactly what the releases attested. Fires when this
# repository's Release run completes green, when a release is published
# by hand, and by hand for re-runs or backfills.
#
# The Release workflow publishes its record with the workflow's own token,
# and GitHub raises no `release` event for anything that token does — so
# the pipeline's own releases arrive here through `workflow_run`, and the
# `release` trigger serves releases published by hand.
#
# Publishing needs the repository variable OSS_NPM_PUBLISH set 'true' and
# the NPM_TOKEN secret; without them the run assembles and dry-packs only.

name: Publish npm suite

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "suite version (default: latest release)"
        type: string
        default: ""
      dry_run:
        description: "assemble + pack only, no publish"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # npm --provenance

concurrency:
  group: publish-npm-suite
  cancel-in-progress: false

jobs:
  publish:
    # A red Release run still publishes its record with whatever attached;
    # the suite needs every binary, so such a release waits for a hand-run.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@mcpg-dev"
      - name: Assemble + publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # A tag-triggered Release run names its tag; the suite then ships
          # that version rather than whichever release is newest by now.
          if [ -z "${VERSION:-}" ] && [ "${RELEASE_REF:-}" != "${RELEASE_REF#v}" ]; then
            VERSION="${RELEASE_REF#v}"
          fi
          export VERSION
          DRY=true
          if [ "${{ vars.OSS_NPM_PUBLISH }}" = "true" ] \
            && [ -n "${NODE_AUTH_TOKEN:-}" ] \
            && [ "${{ inputs.dry_run }}" != "true" ]; then
            DRY=false
          else
            echo "::notice::dry run (gates unset or dry_run requested)"
          fi
          DRY_RUN="$DRY" bash .github/scripts/publish-npm-suite.sh
      - name: Upload packages (inspection)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-suite-packages
          path: dist-npm/*.tgz
          if-no-files-found: ignore
          retention-days: 3
